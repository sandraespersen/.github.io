<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sandra Espersen — Portfolio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: #f3f0e9;
            color: #182536;
            font-family: Arial, Helvetica, sans-serif;
        }

        header {
            padding: 28px 5vw;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #d8d3c8;
            background: #f3f0e9;
        }

        .name {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .title {
            font-size: 14px;
            color: #59615f;
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 70px 5vw 100px;
        }

        .intro {
            max-width: 700px;
            margin-bottom: 45px;
        }

        h1 {
            font-size: clamp(42px, 7vw, 82px);
            line-height: 0.95;
            letter-spacing: -0.055em;
            margin: 0 0 24px;
            font-weight: 700;
        }

        .intro p {
            font-size: 18px;
            line-height: 1.6;
            color: #59615f;
            max-width: 580px;
            margin: 0;
        }

        .portfolio-wrapper {
            background: #ffffff;
            border: 1px solid #d8d3c8;
            box-shadow: 0 12px 40px rgba(24, 37, 54, 0.08);
            overflow: hidden;
        }

        .portfolio-header {
            padding: 18px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e2ded6;
        }

        .portfolio-label {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .open-button {
            display: inline-block;
            padding: 10px 16px;
            background: #b7d83d;
            color: #182536;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            border-radius: 3px;
        }

        .open-button:hover {
            opacity: 0.85;
        }

        .pdf-container {
            width: 100%;
            height: 80vh;
            min-height: 600px;
        }

        .pdf-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        footer {
            padding: 30px 5vw;
            border-top: 1px solid #d8d3c8;
            color: #59615f;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }

        @media (max-width: 700px) {

            header {
                display: block;
            }

            .title {
                margin-top: 5px;
            }

            main {
                padding-top: 45px;
            }

            h1 {
                font-size: 52px;
            }

            .intro p {
                font-size: 16px;
            }

            .portfolio-header {
                padding: 15px;
            }

            .pdf-container {
                height: 70vh;
                min-height: 500px;
            }

            footer {
                display: block;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="name">Sandra Espersen</div>
    <div class="title">Grafisk designteknologstuderende</div>
</header>

<main>

    <section class="intro">
        <h1>Portfolio<br>2026</h1>

        <p>
            Grafisk designteknologstuderende med baggrund i mediegrafik
            og interesse for visuel identitet, grafisk design og
            kreativ kommunikation.
        </p>
    </section>

    <section class="portfolio-wrapper">

        <div class="portfolio-header">
            <div class="portfolio-label">Portfolio</div>

            <a
                class="open-button"
                href="Sandra_Portfolio.pdf"
                target="_blank"
            >
                Åbn PDF ↗
            </a>
        </div>

        <div class="pdf-container">
            <iframe
                src="Sandra_Portfolio.pdf"
                title="Sandra Espersen Portfolio">
            </iframe>
        </div>

    </section>

</main>

<footer>
    <div>© 2026 Sandra Espersen</div>
    <div>Grafisk designteknologstuderende</div>
</footer>

</body>
</html>
